<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biliardino Tornei - Torneo Giallo</title>
    <link rel="icon" href="biliardino-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="biliardino-icon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1c1917">
    
    <!-- Librerie Esterne -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Il tuo file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-layout">
               
        <!-- Sidebar / Menu di Navigazione -->
        <div class="sidebar flex flex-col lg:w-20 xl:w-64 transition-all duration-300 flex-shrink-0 z-50">
            
            <!-- TITOLO -->
            <div class="sidebar-brand hidden lg:flex justify-center xl:justify-start items-center mb-2 lg:mb-6">
                <span class="dot hidden xl:inline-block"></span>
                <h1 class="text-xl font-black text-slate-800 hidden xl:block tracking-tight uppercase">Torneo Giallo</h1>
                <i data-lucide="trophy" class="w-7 h-7 text-amber-500 hidden lg:block xl:hidden mx-auto mt-2"></i>
            </div>

            <!-- INFO -->
            <div class="sidebar-tournament-info hidden xl:block mb-6">
                <strong>Modalità torneo: Torneo Giallo</strong>
                <span>Coppie: rimescolate a ogni turno</span>
            </div>

            <!-- BARRA TASTI -->
            <nav id="nav-list" class="flex lg:flex-col overflow-x-auto lg:overflow-visible gap-2 lg:gap-6 xl:gap-2 pb-2 lg:pb-0 hide-scrollbar w-full lg:mt-4 xl:mt-0">
                
                <div class="nav-link active flex-shrink-0 flex items-center justify-center xl:justify-start gap-2 cursor-pointer" data-view="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 lg:w-6 lg:h-6 xl:w-5 xl:h-5"></i>
                    <span class="nav-label lg:hidden xl:inline">Dashboard</span>
                </div>
                
                <div class="nav-link flex-shrink-0 flex items-center justify-center xl:justify-start gap-2 cursor-pointer" data-view="players">
                    <i data-lucide="users" class="w-5 h-5 lg:w-6 lg:h-6 xl:w-5 xl:h-5"></i>
                    <span class="nav-label lg:hidden xl:inline">Giocatori</span>
                </div>
                
                <div class="nav-link flex-shrink-0 flex items-center justify-center xl:justify-start gap-2 cursor-pointer" data-view="schedule">
                    <i data-lucide="calendar" class="w-5 h-5 lg:w-6 lg:h-6 xl:w-5 xl:h-5"></i>
                    <span class="nav-label lg:hidden xl:inline">Calendario</span>
                </div>
                
                <div class="nav-link flex-shrink-0 flex items-center justify-center xl:justify-start gap-2 cursor-pointer" data-view="standings">
                    <i data-lucide="trophy" class="w-5 h-5 lg:w-6 lg:h-6 xl:w-5 xl:h-5"></i>
                    <span class="nav-label lg:hidden xl:inline">Classifica</span>
                </div>
                
                <div class="nav-link flex-shrink-0 flex items-center justify-center xl:justify-start gap-2 cursor-pointer" data-view="playoffs">
                    <i data-lucide="git-fork" class="w-5 h-5 lg:w-6 lg:h-6 xl:w-5 xl:h-5"></i>
                    <span class="nav-label lg:hidden xl:inline">Playoffs</span>
                </div>
                
                <div class="nav-link flex-shrink-0 flex items-center justify-center xl:justify-start gap-2 cursor-pointer" data-view="settings">
                    <i data-lucide="settings" class="w-5 h-5 lg:w-6 lg:h-6 xl:w-5 xl:h-5"></i>
                    <span class="nav-label lg:hidden xl:inline">Impostazioni</span>
                </div>
                
                <div class="nav-link tv-nav-btn mt-0 lg:mt-4 flex-shrink-0 flex items-center justify-center xl:justify-start gap-2 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 cursor-pointer lg:mx-2 xl:mx-0 rounded-lg p-2" id="tv-mode-btn">
                    <i data-lucide="tv" class="w-5 h-5 lg:w-6 lg:h-6 xl:w-5 xl:h-5 text-amber-400"></i>
                    <span class="nav-label font-semibold lg:hidden xl:inline text-amber-500">Schermo TV</span>
                </div>
            </nav>

            <!-- FOOTER -->
            <!-- FOOTER -->
            <!-- FOOTER -->
            <!-- FOOTER -->
            <div class="sidebar-footer hidden xl:block mt-auto pt-4 border-t border-slate-700/50">
                <p class="text-xs text-stone-400 px-1 mb-1">I dati restano su questo dispositivo.</p>
                <p class="text-[10px] text-stone-500 px-1 mt-2">
                    Sviluppato da <strong class="text-amber-500">Ippazio</strong>
                </p>
            </div>
        </div>

        <!-- Area Contenuti Principale -->
        <div class="content-area">
            
            <div id="alert-container" class="sticky top-0 z-50"></div>
            <div id="save-status" class="save-status" aria-live="polite">Salvataggio automatico attivo</div>
            
            <!-- Intestazione Superiore -->
            <header class="view-header flex justify-between items-center mb-6 no-print">
                <h2 id="view-title" class="text-3xl font-bold text-slate-800">Dashboard</h2>
                <div class="header-actions">
                    <button id="undo-btn" class="btn btn-secondary" disabled title="Annulla">
                        <i data-lucide="undo" class="w-4 h-4"></i>
                        <span>Annulla</span>
                    </button>
                    <button id="redo-btn" class="btn btn-secondary" disabled title="Ripeti">
                        <i data-lucide="redo" class="w-4 h-4"></i>
                        <span>Ripeti</span>
                    </button>
                    <button id="print-section-btn" class="btn btn-secondary" title="Stampa">
                        <i data-lucide="printer" class="w-4 h-4"></i>
                        <span>Stampa</span>
                    </button>
                </div>
            </header>

            <!-- Container Dinamico (qui il JS inietterà le viste) -->
            <div id="content-view"></div>
        </div>

    </div>

    <!-- Modali (Popup) -->
    <div id="modal-container" class="modal-container">
        <div id="modal-content" class="modal-content"></div>
    </div>

    <!-- Input Nascosto per Importazione JSON -->
    <input type="file" id="import-json-file" class="hidden" accept=".json">

    <!-- Modalità Schermo TV / Proiettore Fullscreen -->
    <div id="tv-modal" class="tv-modal hidden">
        <div class="tv-header">
            <div class="tv-brand">
                <span class="tv-dot"></span>
                <h1 class="tv-title">Biliardino Tornei — Live TV</h1>
                <span class="tv-live-badge"><span class="tv-live-dot"></span> LIVE</span>
            </div>
            <div class="tv-actions">
                <button id="tv-fullscreen-btn" class="tv-action-btn" title="Schermo Intero (F11)">
                    <i data-lucide="maximize" class="w-5 h-5"></i>
                    <span>Schermo Intero</span>
                </button>
                <button id="tv-close-btn" class="tv-action-btn tv-action-close" title="Esci dalla modalità TV (ESC)">
                    <i data-lucide="x" class="w-5 h-5"></i>
                    <span>Esci (ESC)</span>
                </button>
            </div>
        </div>
        <div id="tv-content" class="tv-content">
            <!-- Popolato dinamicamente da app.js -->
        </div>
    </div>

    <!-- Il tuo file JavaScript -->
    <script src="app.js"></script>

    <!-- Registrazione Service Worker per uso offline -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.error('Registrazione Service Worker fallita:', err);
                });
            });
        }
    </script>
</body>
</html>
