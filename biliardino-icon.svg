    <rect x="232" y="260" width="48" height="80" fill="#b3860f" rx="8" />
    
    <!-- Giocatore 3 (Destra) -->
    <circle cx="384" cy="150" r="32" fill="#d4a017" />
    <rect x="352" y="176" width="64" height="96" fill="#d4a017" rx="16" />
    <rect x="360" y="260" width="48" height="80" fill="#b3860f" rx="8" />

